name = "moontv-plus"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
minify = true

# 自定义域名路由（milktvp.cc.cd 已托管在同账号 Cloudflare）
# 关闭 workers_dev 后，wrangler 不再要求注册 workers.dev 子域名
workers_dev = false
routes = [
  { pattern = "milktvp.cc.cd/*", zone_name = "milktvp.cc.cd" }
]

# 静态资源配置
# Cloudflare Workers Assets 用于服务静态文件
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "moontvplus"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"
